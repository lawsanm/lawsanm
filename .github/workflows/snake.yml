# Contribution snake — regenerates two themed SVGs and publishes them to the
# `output` branch, which the README reads via a theme-aware <picture>.
#
# One-time setup you have to do by hand (the workflow cannot grant itself this):
#   Repo → Settings → Actions → General → Workflow permissions
#          → "Read and write permissions" → Save
#   That is THIS REPOSITORY's settings page, not your account settings. The job
#   fails with a 403 on the push step without it.
#
# The `output` branch does not exist until this runs green once. Don't trust the
# README's snake block before then — the images will 404.

name: snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Matrix ramp: dots climb #003B00 -> #00FF41. The snake is the pale
          # #C8FFD4 — the near-white leading glyph of matrix rain. A green snake
          # cannot work here: the dots already occupy the whole green ramp, so
          # anything green vanishes the moment it crosses a bright cell. Pale
          # green is the only value left that reads over every dot level.
          #
          # The FIRST colour in color_dots is the empty cell, not the lowest
          # contribution level. On the dark snake it has to be a visible slate:
          # against GitHub's #0d1117 a near-black empty cell vanishes and the
          # grid reads as broken rather than empty.
          outputs: |
            dist/snake-dark.svg?color_snake=%23C8FFD4&color_dots=%23132A16,%23003B00,%23016B22,%2300A62E,%2300FF41
            dist/snake-light.svg?color_snake=%2302220A&color_dots=%23E4F5E8,%23BFE6C6,%236BCB7E,%230A7D26,%23046A20

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
